name: Release

# v1.2.3 の形のタグを push すると、x64 / ARM64 の MSIX をビルドして自己署名の証明書で署名し、
# インストール用の zip を GitHub Release に添付する。手順は docs/release.md。
# 手動実行（workflow_dispatch）では Release を作らず、zip を成果物（Artifacts）に残すだけにする。
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン（1.2.3 の形）'
        required: true
        default: '0.0.1'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'push') { '${{ github.ref_name }}'.Substring(1) } else { '${{ inputs.version }}' }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "バージョンは 1.2.3 の形にしてください: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test Core
        run: dotnet test --project tests/StationCountdown.Core.Tests
      - name: Test Importers
        run: dotnet test --project tests/StationCountdown.Importers.Tests

      - name: Prepare signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) {
            throw 'Secrets に SIGNING_CERT_PFX_BASE64 がありません。docs/release.md の手順で署名の証明書を登録してください。'
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing.pfx", [Convert]::FromBase64String($env:PFX_BASE64))

      - name: Build and sign packages
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          ./tools/windows/New-ReleasePackage.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -CertificatePath "$env:RUNNER_TEMP\signing.pfx" `
            -CertificatePassword (ConvertTo-SecureString $env:PFX_PASSWORD.Trim() -AsPlainText -Force) `
            -OutputDir "$env:GITHUB_WORKSPACE\out\release"

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\signing.pfx" -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: StationCountdown-${{ steps.version.outputs.version }}
          path: |
            out/release/StationCountdown-${{ steps.version.outputs.version }}.zip
            out/release/StationCountdown-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          gh release create '${{ github.ref_name }}' `
            "out/release/StationCountdown-$version.zip" `
            "out/release/StationCountdown-$version.zip.sha256" `
            --verify-tag `
            --title "Station Countdown $version" `
            --notes-file .github/release-notes.md `
            --generate-notes
