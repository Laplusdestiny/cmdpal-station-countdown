name: Release

# GitHub で Release を公開（published）すると、x64 / ARM64 の MSIX をビルドして自己署名の証明書で署名し、
# インストール用の zip をその Release に添付する。Release のタグは v1.2.3 の形にする。手順は docs/release.md。
# 手動実行（workflow_dispatch）では Release に触らず、zip を成果物（Artifacts）に残すだけにする。
#
# タグの push では起動しない。GitHub の画面で Release を作るとタグも作られるため、
# 両方で起動すると同じビルドが 2 回走り、片方が「同じタグの Release がもうある」で失敗する。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'バージョン（1.2.3 の形）'
        required: true
        default: '0.0.1'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Determine version
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ('${{ github.event_name }}' -eq 'release') {
            if ($env:TAG_NAME -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Release のタグは v1.2.3 の形にしてください: $env:TAG_NAME" }
            $version = $Matches[1]
          } else {
            $version = $env:INPUT_VERSION
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "バージョンは 1.2.3 の形にしてください: $version" }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test Core
        run: dotnet test --project tests/StationCountdown.Core.Tests
      - name: Test Importers
        run: dotnet test --project tests/StationCountdown.Importers.Tests

      - name: Prepare signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_BASE64) {
            throw 'Secrets に SIGNING_CERT_PFX_BASE64 がありません。docs/release.md の手順で署名の証明書を登録してください。'
          }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\signing.pfx", [Convert]::FromBase64String($env:PFX_BASE64))

      - name: Build and sign packages
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          ./tools/windows/New-ReleasePackage.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -CertificatePath "$env:RUNNER_TEMP\signing.pfx" `
            -CertificatePassword (ConvertTo-SecureString $env:PFX_PASSWORD.Trim() -AsPlainText -Force) `
            -OutputDir "$env:GITHUB_WORKSPACE\out\release"

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\signing.pfx" -Force -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: StationCountdown-${{ steps.version.outputs.version }}
          path: |
            out/release/StationCountdown-${{ steps.version.outputs.version }}.zip
            out/release/StationCountdown-${{ steps.version.outputs.version }}.zip.sha256
          if-no-files-found: error

      - name: Attach packages to the GitHub Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          # --clobber: 再実行したときは同じ名前のファイルを置き換える
          gh release upload $env:TAG_NAME `
            "out/release/StationCountdown-$version.zip" `
            "out/release/StationCountdown-$version.zip.sha256" `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release への添付に失敗しました（exit $LASTEXITCODE）" }

      - name: Add install instructions to the release notes
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          # 説明文の先頭にインストール手順（.github/release-notes.md）を入れる。目印のコメントがあれば入れ済みなので何もしない（再実行のとき）
          $PSNativeCommandArgumentPassing = 'Standard'  # jq の式の中の " を gh にそのまま渡す
          $marker = '<!-- station-countdown:install-notes -->'
          $hasNotes = gh release view $env:TAG_NAME --json body --jq ".body | contains(`"$marker`")"
          if ($LASTEXITCODE -ne 0) { throw "Release の説明文を読めませんでした（exit $LASTEXITCODE）" }
          if ($hasNotes -eq 'true') { Write-Host 'インストール手順は入れ済みです'; exit 0 }

          $notes = Get-Content -Raw -Encoding utf8 .github/release-notes.md
          $body = if ($env:RELEASE_BODY) { "$notes`n$($env:RELEASE_BODY)" } else { $notes }
          $file = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [IO.File]::WriteAllText($file, $body, [Text.UTF8Encoding]::new($false))
          gh release edit $env:TAG_NAME --notes-file $file
          if ($LASTEXITCODE -ne 0) { throw "Release の説明文を更新できませんでした（exit $LASTEXITCODE）" }
