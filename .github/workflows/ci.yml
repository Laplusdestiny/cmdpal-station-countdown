name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test Core
        run: dotnet test --project tests/StationCountdown.Core.Tests
      - name: Test Core in a non-JST time zone
        # 計算が PC のタイムゾーンに依存しないことを確かめる（Review Focus 2）。
        run: dotnet test --project tests/StationCountdown.Core.Tests --no-build
        env:
          TZ: America/Los_Angeles
      - name: Test Importers
        run: dotnet test --project tests/StationCountdown.Importers.Tests
      - name: Publish trimmed probe (spec §10 V4・V5)
        # トリミングの警告はすべてエラーになる（tools/TrimProbe/TrimProbe.csproj）
        run: dotnet publish tools/TrimProbe -c Release -r linux-x64 -o out/TrimProbe
      - name: Run trimmed probe
        run: out/TrimProbe/TrimProbe

  extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Windows でだけ起きる違い（改行コードなど）を、リリースの前に見つけるため、Windows でもテストを流す。
      - name: Test Core on Windows
        run: dotnet test --project tests/StationCountdown.Core.Tests
      - name: Test Importers on Windows
        run: dotnet test --project tests/StationCountdown.Importers.Tests
      - name: Build extension (x64, Release)
        run: dotnet build src/StationCountdown.Extension -c Release -p:Platform=x64
      - name: Build extension without importers (x64, Release)
        # 一般公開版（#4）向けの切り替え。阪急のインポーターを含めずにビルドできることを確かめる
        run: dotnet build src/StationCountdown.Extension -c Release -p:Platform=x64 -p:IncludeImporters=false
